[workspace]
resolver = "2"
members = [
    "crates/burpfree-core",
    "crates/burpfree-codec",
    "crates/burpfree-ca",
    "crates/burpfree-storage",
    "crates/burpfree-proxy",
    "crates/burpfree-engines",
    "crates/burpfree-api",
    "crates/burpfree-cli",
    "crates/burpfree-extensions",
    "crates/burpfree-oob",
    "crates/burpfree-report",
    "crates/burpfree-script",
    "crates/burpfree-mcp",
    "crates/burpfree-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
authors = ["BurpFree contributors"]
repository = "https://github.com/burpfree/burpfree"
description = "Open, original desktop web-security testing platform."

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal", "process"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
bytes = "1.7"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "env"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http = "1.1"
http-body = "1.0"
http-body-util = "0.1"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2.1"
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
x509-parser = "0.16"
url = "2.5"
percent-encoding = "2.3"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
flate2 = "1.0"
brotli = "7.0"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
rand = "0.8"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
mime = "0.3"
tungstenite = "0.24"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "6.1"
walkdir = "2.5"
dirs = "5.0"
tempfile = "3.12"
axum = { version = "0.7", features = ["ws", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
async-stream = "0.3"
pin-project-lite = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = 1
